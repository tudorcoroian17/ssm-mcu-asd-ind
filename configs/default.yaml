seed: 158

data:
  channel: ch1
  eval_balance_ratio: 1.0
  eval_balance_seed: 0
  val_fraction: 0.2
  val_split_seed: 0

features:
  sample_rate: 16000
  n_fft: 1024
  hop_length: 512
  n_mels: 64
  f_min: 0.0
  f_max: 8000.0
  htk: false
  mel_norm: slaney
  power: 2.0
  log_eps: 1.0e-6
  center: true

model:
  n_mels: 64
  d_model: 64
  learned_input_embed: false
  d_state: 32
  n_layers: 4
  d_conv: 4
  expand: 2
  selective: true
  discretization: zoh
  pooling: mean

training:
  horizon_k: 2
  batch_size: 32
  learning_rate: 1.0e-3
  max_epochs: 100
  early_stopping_patience: 10
  min_val_improv_delta: 3.0e-4